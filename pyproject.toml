# Copyright 2021-2026 Nokia

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysros"
dynamic = ["version"]
description = "Python for the Nokia Service Router Operating Systems (pySROS)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "LicenseRef-Nokia-Proprietary"
license-files = ["LICENSE.md"]
authors = [
    { name = "Nokia" },
]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "ncclient~=0.7.1",
    "lxml~=6.1.0",
]

[project.urls]
Homepage = "https://www.nokia.com"
Documentation = "https://network.developer.nokia.com/static/sr/learn/pysros/latest/"
Source = "https://github.com/nokia/pysros"

[tool.setuptools]
packages = ["pysros"]

[tool.setuptools.dynamic]
version = { attr = "pysros.__version__" }
